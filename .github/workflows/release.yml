name: Release

# Publishes to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing — no API token is stored in this repo.
# One-time setup: https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#   owner: agrvasu05, repository: DevCrew, workflow: release.yml, environment: pypi

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
