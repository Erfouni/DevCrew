[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devcrew"
dynamic = ["version"]
description = "An AI software team in a pipeline: four agents plan, code, test and review a project from a one-line idea."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vasu Agrawal" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.0.0",
    "python-dotenv>=1.0.0",
]
keywords = ["ai", "agents", "multi-agent", "crewai", "llm", "code-generation", "code-review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
devcrew = "devcrew.cli:main"

[project.urls]
Homepage = "https://github.com/agrvasu05/DevCrew"
Issues = "https://github.com/agrvasu05/DevCrew/issues"
Changelog = "https://github.com/agrvasu05/DevCrew/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "devcrew/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["devcrew", "tests", "sample_output", "main.py", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["sample_output"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
